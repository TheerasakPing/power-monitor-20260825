    <script>
      $(document).ready(function () {
        $("#show_hide_password a").on("click", function (event) {
          event.preventDefault();
          if ($("#show_hide_password input").attr("type") == "text") {
            $("#show_hide_password input").attr("type", "password");
            $("#show_hide_password i").addClass("bx-hide");
            $("#show_hide_password i").removeClass("bx-show");
          } else if (
            $("#show_hide_password input").attr("type") == "password"
          ) {
            $("#show_hide_password input").attr("type", "text");
            $("#show_hide_password i").removeClass("bx-hide");
            $("#show_hide_password i").addClass("bx-show");
          }
        });
      });
      // alert(document.URL.substring(0, document.URL.length-15))
      // $(".page-login").show();
      // $(".page-forgot").hide();

      $(".l_err").hide();
      $("#login").submit(function (e) {
        e.preventDefault();
        if ($([this.name]).val() === "" && $([this.pass]).val() === "") {
          $([this.name]).addClass("is-invalid");
          $([this.pass]).addClass("is-invalid");
          return false;
        }
        if ($([this.name]).val() === "") {
          $([this.name]).addClass("is-invalid");
          return false;
        } else {
          $([this.name]).removeClass("is-invalid");
        }
        if ($([this.pass]).val() === "") {
          $([this.pass]).addClass("is-invalid");
          return false;
        } else {
          $([this.pass]).removeClass("is-invalid");
        }
        // if (isValidEmailAddress($([this.name]).val())) {
        //     var status = "email";
        // } else {
        //     var status = "user";
        // }
        // alert($([this.name]).val())
        $.ajax({
          type: "POST",
        //   url: "https://powermeter.smartsoul-pcb.com/db/login.php",
          url: "db/login.php",
          data: $(this).serialize(),
          dataType: "json",
          success: function (res) {
            // console.log(res)
            // return false
            if (res.account_name === "No user") {
              $(".l_err").show();
              return false;
            } 
            else if(res.account_name === 'Disallow'){
              swal({
                  title: 'ระงับการใช้งานชั่วคราว !',
                  html: "บัญชีของคุณถูกระงับการใช้งานชั่วคราว <br> กรุณาติดต่อผู้ดูแลระบบ",
                  type: 'warning',
                  allowOutsideClick: false,
                  confirmButtonColor: '#32CD32'
              });
              return false;
            }else{
              $.ajax({
                url: "db/session.php",
                type: "POST",
                data: {
                  login: res,
                },
                dataType: 'json',
                success: function (data) {
                  // console.log(data);

                  
                  if (res.account != "") {
                    // alert(res.name_login)
                    // return false;
                    window.location.href = document.URL.substring(0, document.URL.length-15)
                    // if(res.site_.count_site == 1 && res.site_.count_House == 1){
                    //     window.location.href = document.URL.substring(0, document.URL.length-15)+"#"+res.site_.h;
                    // }else{
                    //     window.location.href = document.URL.substring(0, document.URL.length-15)+"#"+$.base64.encode('0,0,0,0,0zasn');
                    // }
                  }
                },
              });
            }
          },
          error: function (data) {
            swal({
                title: 'Error',
                text: "เกิดข้อผิดพลาด",
                type: 'warning',
                allowOutsideClick: false,
                confirmButtonColor: '#32CD32'
            });
          },
        });
      });
    </script>
