      // กำหนด masterData เป็น global variable เพื่อใช้ทั้งใน updateChart() และ realtime update
      let account = null,
        display = null,
        logSite = null,
        select = null,
        theme = null,
        dataLog = [],
        loadDataHouse = [],
        realtimeInterLoadData = null,
        realtimeInterChart = null,
        realtimeInterTable = null,
        realtimeDataTable = [];

      // // กำหนดค่า default สำหรับ currentMode, currentTimeRange, resolution
      let currentType = "ENERGY"; // ค่าเริ่มต้น mode
      let currentTimeFrame = "day"; // default สำหรับ ENERGY mode คือ day (24 Hour)
      
      $(document).ready(async function () {
        let msg = JSON.parse(sessionStorage.getItem("sessionLog"));
        // console.log(msg);
        mainPage(msg)
        $("#show_hide_password a").on("click", function (event) {
          event.preventDefault();
          if ($("#show_hide_password input").attr("type") == "text") {
            $("#show_hide_password input").attr("type", "password");
            $("#show_hide_password i").addClass("bx-hide");
            $("#show_hide_password i").removeClass("bx-show");
          } else if (
            $("#show_hide_password input").attr("type") == "password"
          ) {
            $("#show_hide_password input").attr("type", "text");
            $("#show_hide_password i").removeClass("bx-hide");
            $("#show_hide_password i").addClass("bx-show");
          }
        });
        
        $("#login").submit(function (e) {
          e.preventDefault();
          if ($([this.name]).val() === "" && $([this.pass]).val() === "") {
            $([this.name]).addClass("is-invalid");
            $([this.pass]).addClass("is-invalid");
            return false;
          }
          if ($([this.name]).val() === "") {
            $([this.name]).addClass("is-invalid");
            return false;
          } else {
            $([this.name]).removeClass("is-invalid");
          }
          if ($([this.pass]).val() === "") {
            $([this.pass]).addClass("is-invalid");
            return false;
          } else {
            $([this.pass]).removeClass("is-invalid");
          }
          $.ajax({
            type: "POST",
            url: "https://api.smartsoul-pcb.com/powermeter/login.php",
            data: $(this).serialize(),
            dataType: "json",
            success: function (res) {
              if (res.status === false){
                if (res.message === 'No user') {
                  $(".l_err").show();
                  return false;
                } else if (res.message === "Suspend") {
                  swal({
                    title: "ระงับการใช้งานชั่วคราว !",
                    html: "บัญชีของคุณถูกระงับการใช้งานชั่วคราว <br> กรุณาติดต่อผู้ดูแลระบบ",
                    type: "warning",
                    allowOutsideClick: false,
                    confirmButtonColor: "#32CD32",
                  });
                  return false;
                }
              } 
              else {
                sessionStorage.setItem("sessionLog", JSON.stringify(res.data));
                // window.location.reload()
                mainPage(res.data)    
                // console.log(res.data)
                // return false
                
              }
            },
            error: function (data) {
              swal({
                title: "Error",
                text: "เกิดข้อผิดพลาด",
                type: "warning",
                allowOutsideClick: false,
                confirmButtonColor: "#32CD32",
              });
            },
          });
        });
        $(".logout").click(function () {
          logout();
        });
        // return false;
        
        $(document).on("click", ".selectSite", async function () {
          const loopID = $(this).data("loopId");
          const groupSite = groupBySite(logSite);
          const newGroupSite = groupSite[loopID];
          // console.log(groupSite[loopID])
          // console.log(groupSite[loopID].houses.length) //length
          // console.log(newGroupSite.houses[0])

          const parse = JSON.parse(sessionStorage.getItem("sessionLog"));
          parse.display.select['siteID'] = newGroupSite.site_id;
          parse.display.select['siteName'] = newGroupSite.site_name;
          parse.display.select['loop'] = loopID;
          if (newGroupSite.houses.length > 1) {
            parse.display.select['houseName'] = '';
          }
          else {
            parse.display.select['houseID'] = newGroupSite.houses[0].house_id;
            parse.display.select['phase'] = newGroupSite.houses[0].house_phase;
            parse.display.select['sn'] = newGroupSite.houses[0].house_sn;
            parse.display.select['houseName'] = newGroupSite.houses[0].house_name;
            parse.display.select['temp'] = newGroupSite.houses[0].house_temp;
            parse.display.select['loopHouse'] = 0;
          }
          display = parse.display;
          select = display.select;
          
          // console.log(parse);
          
          sessionStorage.setItem("sessionLog", JSON.stringify(parse));
          statusMenu(display, "selectSite", newGroupSite.houses.length);
          $.each(groupSite[display.select.loop].houses, function (index, key) {
            loadDataHouse.push({
              siteID: key.site_id,
              houseID: key.house_id,
              sn: key.house_sn,
              phase: key.house_phase,
            });
          });
          if (newGroupSite.houses.length > 1) {
            getHouse(newGroupSite.houses, loadDataHouse);
            startRealtime(loadDataHouse);
          }
          else {
            // console.log(loadDataHouse);
            await dashboard(select, loadDataHouse);
            await startRealtime(loadDataHouse);

            const masterData = await getDataChart(select);
            // console.log(masterData);
            await updateMainChart(masterData);
            // await updateChart('ENERGY', 'day', mockData);
            const masterData2 = await getDataTable(select);
            await renderTable(masterData2, "realtime");
          } 
        });
        $(document).on("click", ".selectHouse", async function () {
          const loopID = display.select.loop;
          const houseLoop = $(this).data("loopId");
          const groupSite = groupBySite(logSite);
          const newHouse = groupSite[loopID].houses[houseLoop];
          // console.log(groupSite[loopID].houses[houseLoop])
          // console.log(groupSite[loopID].houses.length) //length
          // alert(groupSite)
          // console.log(newGroupSite);
          // return false
          const parse = JSON.parse(sessionStorage.getItem("sessionLog"));
          parse.display.select['houseID'] = newHouse.house_id;
          parse.display.select['phase'] = newHouse.house_phase;
          parse.display.select['sn'] = newHouse.house_sn;
          parse.display.select['houseName'] = newHouse.house_name;
          parse.display.select['temp'] = newHouse.house_temp;
          parse.display.select['loopHouse'] = houseLoop;
          display = parse.display;
          select = display.select;
          
          // console.log(parse);
          
          sessionStorage.setItem("sessionLog", JSON.stringify(parse));
          
          statusMenu(display, "", groupSite[loopID].houses.length);
